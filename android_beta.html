<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Beta Tester Sign-Up - KyberChat</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <style>
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--text-dim);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background-color: var(--code-bg);
            border: 1px solid #30363d;
            border-radius: 6px;
            font-family: inherit;
            color: var(--text-main);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .btn-submit {
            padding: 12px 24px;
            background-color: var(--primary-blue);
            color: var(--dark-bg);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container">
        <nav style="margin-top: 20px;">
            <a href="index.html" style="color: var(--primary-blue); text-decoration: none;">&larr; Back to Home</a>
        </nav>

        <header>
            <img src="kyberchat_logo.png" alt="KyberChat Logo" class="hero-logo">
            <h1>Android Beta Tester Sign-Up</h1>
            <p class="subtitle">Help shape the future of KyberChat on Android.</p>
        </header>

        <section>
            <div class="card">
                <p style="margin-bottom: 25px;">KyberChat for Android is currently in private beta. Fill out the form below to apply for access, and we'll be in touch.</p>
                <form action="submit_beta_signup.php" method="POST">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" required placeholder="First Name" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" required placeholder="Last Name" maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="your@email.com" maxlength="255">
                    </div>

                    <button type="submit" class="btn-submit">Apply to Beta Test</button>
                </form>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 WhiteAcre Software. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
